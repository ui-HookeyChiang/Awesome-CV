meta:
  title: Custom CSS Test Deck
  lang: zh-Hant
  custom_css: |
    .flow-box {
      background: var(--card-bg);
      border-left: 4px solid var(--primary);
      padding: 16px;
      margin: 12px 0;
    }
    .big-statement {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
      margin: 30px 0;
    }
    .cheat-sheet-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--slide-bg);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 24px;
      z-index: 1000;
      max-width: 80%;
      max-height: 80%;
      overflow-y: auto;
    }

approved: true
slides:
  - id: intro
    act: 1
    claim: "Custom CSS Test"
    bridge: "This slide uses custom HTML classes with styles"
    element:
      type: html
      data:
        html: |
          <div class="flow-box">
            <p>First flow step</p>
          </div>
          <div class="big-statement">
            Major point with custom styling
          </div>
    facts: []
  - id: summary
    act: 1
    claim: "Summary"
    bridge: "Final slide"
    element:
      type: statement
      data:
        text: "Basic statement"
    facts: []
