<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Deck Template</title>
    <!-- Fonts: Avenir Next (system), Calibri (fallback), Consolas (code) -->
    <style>
        :root {
            --page-bg: #12121f;
            --slide-bg: #1A1A2E;
            --card-bg: #25253A;
            --text-primary: #FFFFFF;
            --text-secondary: #F0F0F5;
            --text-muted: #888899;
            --primary: #006FFF;
            --success: #00C853;
            --accent: #00D4FF;
            --orange: #FF9F00;
            --alert: #FF4545;
            --border: #3A3A55;
            --code-bg: #0D0D1A;
            --code-text: #00C853;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Avenir Next', Calibri, sans-serif;
            line-height: 1.6;
            color: var(--text-secondary);
            background: var(--page-bg);
            overflow-x: hidden;
        }

        .presentation {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .slide {
            background: var(--slide-bg);
            border-radius: 14px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            box-shadow: 0 6px 30px rgba(0,0,0,0.5);
            min-height: 80vh;
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            page-break-after: always;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .slide h1 {
            font-family: 'Avenir Next', Calibri, sans-serif;
            color: var(--text-primary);
            font-size: 2.2rem;
            margin-bottom: 8px;
            font-weight: 600;
            position: relative;
        }

        .slide h1::after {
            content: '';
            display: block;
            width: 35%;
            height: 3px;
            background: var(--primary);
            margin-top: 10px;
            border-radius: 2px;
        }

        .slide h2 {
            font-family: 'Avenir Next', Calibri, sans-serif;
            color: var(--text-primary);
            font-size: 1.8rem;
            margin-bottom: 20px;
            margin-top: 30px;
            font-weight: 600;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin: 8px 0 22px;
        }

        .big-sub {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        /* Semantic emphasis: 4px left border + 6% alpha tint */
        .sar-item {
            background: var(--slide-bg);
            padding: 20px;
            border-radius: 10px;
            border: none;
        }

        .sar-item strong {
            color: var(--text-primary);
            display: block;
            margin-bottom: 8px;
        }

        .sar-situation {
            grid-column: 1 / -1;
            border: none;
            border-left: 4px solid var(--alert);
            background: rgba(255,69,69,0.06);
        }

        .sar-action {
            grid-column: 1 / -1;
            border: none;
            border-left: 4px solid var(--primary);
            background: rgba(0,111,255,0.06);
            margin-top: 0;
        }

        .sar-result {
            grid-column: 1 / -1;
            border: none;
            border-left: 4px solid var(--success);
            background: rgba(0,200,83,0.06);
            margin-top: 0;
        }

        .navigation-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }

        /* Print media query: light theme + page breaks */
        @media print {
            body { background: white; color: #1f2937; }
            .presentation {
                max-width: none;
                padding: 0;
            }
            .slide {
                box-shadow: none;
                border: 1px solid #e5e7eb;
                min-height: auto;
                width: 100%;
                margin-bottom: 20px;
                page-break-after: always;
                background: white;
                color: #1f2937;
            }
            .navigation-hint { display: none; }
        }

        /* Speaker notes modal */
        .cheat-sheet-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .cheat-sheet-modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
            color: var(--text-secondary);
        }

        .cheat-sheet-modal-content h2 {
            color: var(--text-primary);
            margin-bottom: 15px;
        }

        .cheat-sheet-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--border);
            color: var(--text-secondary);
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="presentation">
        <!-- Example slide structure: fill with your content -->
        <div class="slide">
            <h1>Slide Title</h1>
            <p>Add your content here.</p>
        </div>

        <!-- Example SAR slide -->
        <div class="slide">
            <h1>Example: Situation-Action-Result</h1>
            <div class="sar-item sar-situation">
                <strong>Situation</strong>
                <p>Context and challenge.</p>
            </div>
            <div class="sar-item sar-action">
                <strong>Action</strong>
                <p>What you did.</p>
            </div>
            <div class="sar-item sar-result">
                <strong>Result</strong>
                <p>Outcome and impact.</p>
            </div>
        </div>
    </div>

    <!-- Speaker notes modal -->
    <div id="cheatSheetModal" class="cheat-sheet-modal">
        <div class="cheat-sheet-modal-content">
            <h2 id="cheatSheetTitle">Notes</h2>
            <div id="cheatSheetBody"></div>
            <button class="cheat-sheet-close" onclick="closeCheatSheet()">Close (ESC)</button>
        </div>
    </div>

    <!-- Navigation hint (updates with current slide) -->
    <div class="navigation-hint"></div>

    <script>
        // ── Slide navigation ──
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;
        let currentSlide = 0;

        // Speaker notes (customize per deck)
        const cheatSheets = {
            example: {
                title: 'Example Notes',
                content: 'Add speaker notes here. Click or press Enter on a [data-cheat] element to trigger.'
            }
        };

        function showCheatSheet(cheatKey) {
            const cheatSheet = cheatSheets[cheatKey];
            if (cheatSheet) {
                document.getElementById('cheatSheetTitle').innerHTML = cheatSheet.title;
                document.getElementById('cheatSheetBody').innerHTML = cheatSheet.content;
                document.getElementById('cheatSheetModal').style.display = 'flex';

                // Prevent background scrolling
                document.body.style.overflow = 'hidden';
            }
        }

        function closeCheatSheet() {
            document.getElementById('cheatSheetModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Close modal when clicking outside content
        document.getElementById('cheatSheetModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeCheatSheet();
            }
        });

        // Navigation functions
        function showSlide(n) {
            if (n >= 0 && n < totalSlides) {
                currentSlide = n;
                slides[currentSlide].scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides - 1) {
                showSlide(currentSlide + 1);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                showSlide(currentSlide - 1);
            }
        }

        // Enhanced keyboard navigation
        document.addEventListener('keydown', function(e) {
            // Check if modal is open first (modal owns Esc)
            if (document.getElementById('cheatSheetModal').style.display === 'flex') {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    closeCheatSheet();
                }
                return; // Don't process other keys when modal is open
            }

            switch(e.key) {
                case 'ArrowRight':
                case ' ':
                case 'PageDown':
                    e.preventDefault();
                    nextSlide();
                    break;
                case 'ArrowLeft':
                case 'PageUp':
                    e.preventDefault();
                    prevSlide();
                    break;
                case 'Home':
                    e.preventDefault();
                    showSlide(0);
                    break;
                case 'End':
                    e.preventDefault();
                    showSlide(totalSlides - 1);
                    break;
                case 'Escape':
                    // Toggle fullscreen
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen();
                    } else {
                        document.exitFullscreen();
                    }
                    break;
            }
        });

        // Add click and keyboard handlers for cheat sheet triggers
        document.querySelectorAll('[data-cheat]').forEach(element => {
            element.addEventListener('click', function() {
                const cheatKey = this.getAttribute('data-cheat');
                if (cheatKey) {
                    showCheatSheet(cheatKey);
                }
            });
            element.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    const cheatKey = this.getAttribute('data-cheat');
                    if (cheatKey) showCheatSheet(cheatKey);
                }
            });
        });

        // Update navigation hint with current slide and controls
        function updateNavigationHint() {
            const hint = document.querySelector('.navigation-hint');
            hint.innerHTML = `
                Slide ${currentSlide + 1} of ${totalSlides} |
                Use ← → arrow keys to navigate |
                Press ESC for fullscreen
            `;
        }

        // Initialize
        updateNavigationHint();

        // Update navigation hint when slide changes (IntersectionObserver at 0.5 threshold)
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const slideIndex = Array.from(slides).indexOf(entry.target);
                    if (slideIndex !== -1) {
                        currentSlide = slideIndex;
                        updateNavigationHint();
                    }
                }
            });
        }, { threshold: 0.5 });

        slides.forEach(slide => observer.observe(slide));

        console.log('Slide deck loaded successfully!');
        console.log('Navigation: Use arrow keys / Space / PageUp/PageDown / Home / End');
        console.log('Fullscreen: Press ESC');
        console.log('Total slides:', totalSlides);
    </script>
</body>
</html>
